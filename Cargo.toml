[workspace]
resolver = "2"
members = [
    "crates/s-types",
    "crates/s-config",
    "crates/s-gguf",
    "crates/s-tokenizer",
    "crates/s-backend",
    "crates/s-backend-cpu",
    "crates/s-backend-cuda",
    "crates/s-backend-vulkan",
    "crates/s-models",
    "crates/s-kv",
    "crates/s-speculative",
    "crates/s-server",
    "crates/s-voice",
]
# I kernel GPU sono un crate a sé: compilato da cuda_builder con target
# nvptx64 e nightly pinnato (vedi crates/s-backend-cuda/kernels/).
exclude = ["crates/s-backend-cuda/kernels"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Sempre <Progetto Siliceo>"]

[workspace.lints.rust]
unsafe_code = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
