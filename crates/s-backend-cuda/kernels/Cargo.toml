[package]
name = "s-cuda-kernels"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Sempre <Progetto Siliceo>"]
publish = false

# Crate dei kernel GPU — NON è un membro del workspace (escluso nel Cargo.toml
# radice): viene compilato da cuda_builder con target nvptx64-nvidia-cuda e
# -Zbuild-std, con il nightly pinnato in rust-toolchain.toml
# (rustc_codegen_nvvm usa interni di rustc: la versione deve combaciare).

[dependencies]
# Matematica via crate `libm`: sul target nvptx i metodi di f32 NON esistono
# in core (arrivano da std, che nvptx non ha). rustc_codegen_nvvm fa il
# "libm override": le chiamate a libm vengono riscritte con gli intrinsic
# libdevice (__nv_*) al codegen — niente std, niente half, niente cuda_std.
# Su host libm è l'implementazione di riferimento: stessi algoritmi dei
# test di parity CPU.
libm = "0.2"
cuda_std_macros = { git = "https://github.com/Rust-GPU/Rust-CUDA" }

[lib]
crate-type = ["cdylib", "rlib"]

# Crate radice di un workspace proprio: non deve mai essere assorbito
# dal workspace padre (compilato con target/toolchain diversi).
[workspace]
